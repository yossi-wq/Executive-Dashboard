name: Poll Gmail for urgent signals

on:
  schedule:
    # GitHub's minimum schedule granularity is 5 minutes; runs are
    # best-effort and can slip under load, and scheduled workflows are
    # auto-disabled after 60 days with no commits to the repo.
    - cron: "*/7 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/gmail-check
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::DASHBOARD_URL repo variable and/or CRON_SECRET repo secret not set yet — see README. Skipping without failing so this stops emailing on every run until setup is finished."
            exit 0
          fi
          curl -sf -X POST "$DASHBOARD_URL/api/cron/gmail-check" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Length: 0"
